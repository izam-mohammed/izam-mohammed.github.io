      <circle cx="1133" cy="42" r="1.1"/><circle cx="1167" cy="40" r="1.3"/><circle cx="433" cy="264" r="1.1"/><circle cx="1100" cy="228" r="2.0"/><circle cx="655" cy="248" r="2.0"/>
