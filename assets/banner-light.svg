      <path d="M116 28 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2z"/><path d="M400 148 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2z"/><path d="M674 20 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2z"/><path d="M1060 102 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2z"/><path d="M1176 150 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2z"/><path d="M256 266 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2z"/>
