    <g fill="none" stroke="#57606a" stroke-width="2" stroke-linecap="round" stroke-opacity="0.95">
      <path d="M622 74 q6 -6 12 0 q6 -6 12 0"/><path d="M656 92 q5 -5 10 0 q5 -5 10 0"/><path d="M226 40 q5 -5 10 0 q5 -5 10 0"/>
