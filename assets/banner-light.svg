<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">izam-mohammed.github.io</title>
  <desc id="d">A house for sale. The house is a plain browser window with a roof on it, showing the site in default Times New Roman with blue and purple links, and a default grey button for a door. A for sale sign on the lawn reads: charming 1999-era fixer-upper, original features, no css, no node_modules, tons of space. A sticker says as is. The rider under it says: open house, open index.html.</desc>

  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky, plus whatever the weather is doing -->
    <rect width="1200" height="400" fill="#dcecfb"/>
    <circle cx="470" cy="74" r="28" fill="#ffd84d"/>
    <g fill="#ffffff" fill-opacity="0.95">
      <path d="M290 70 a18 18 0 0 1 30 -12 a24 24 0 0 1 44 6 a16 16 0 0 1 4 30 h-74 a12 12 0 0 1 -4 -24z"/>
      <path d="M1110 54 a14 14 0 0 1 24 -9 a19 19 0 0 1 34 5 a12 12 0 0 1 3 23 h-58 a10 10 0 0 1 -3 -19z"/>
    </g>
    <g fill="#e6edf3" fill-opacity="0">
      <circle cx="80" cy="40" r="1.6"/><circle cx="240" cy="62" r="1.2"/><circle cx="340" cy="28" r="1.8"/>
      <circle cx="560" cy="34" r="1.3"/><circle cx="640" cy="78" r="1.1"/><circle cx="1010" cy="30" r="1.7"/>
      <circle cx="1150" cy="70" r="1.3"/><circle cx="1180" cy="24" r="1.1"/><circle cx="420" cy="120" r="1.2"/>
    </g>

    <!-- the lawn -->
    <rect y="330" width="1200" height="70" fill="#8cc66d"/>
    <rect y="330" width="1200" height="6" fill="#74b157"/>

    <!-- the house, which is a browser window with a roof on it -->
    <rect x="980" y="58" width="34" height="60" fill="#9a4a37"/>
    <polygon points="548,126 840,40 1132,126" fill="#b4553f" stroke="#8a3e2d" stroke-width="3" stroke-linejoin="round"/>
    <rect x="566" y="122" width="548" height="210" fill="#ffffff" stroke="#9aa1a9" stroke-width="2"/>
    <rect x="566" y="122" width="548" height="30" fill="#e7e9ec" stroke="#9aa1a9" stroke-width="2"/>
    <g fill="#9aa1a9"><circle cx="584" cy="137" r="5"/><circle cx="600" cy="137" r="5"/><circle cx="616" cy="137" r="5"/></g>
    <rect x="640" y="128" width="400" height="18" rx="9" fill="#ffffff"/>
    <text x="656" y="141" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57606a">izam-mohammed.github.io</text>

    <g font-family="'Times New Roman', Times, serif" fill="#000000">
      <text x="586" y="190" font-size="30" font-weight="700">Izam Mohammed</text>
      <text x="586" y="218" font-size="16">just another ml engineer on the internet.</text>
      <text x="596" y="246" font-size="16">• i dump my <tspan fill="#0000ee" text-decoration="underline">brain</tspan> sometimes so i don't forget stuff.</text>
      <text x="596" y="270" font-size="16">• <tspan fill="#551a8b" text-decoration="underline">GitHub</tspan> - mostly unfinished projects</text>
    </g>
    <!-- front door: one unstyled <button> -->
    <rect x="1010" y="262" width="74" height="70" rx="3" fill="#efefef" stroke="#767676" stroke-width="1.5"/>
    <text x="1042" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#000000">come in</text>
    <circle cx="1075" cy="297" r="2.5" fill="#767676"/>

    <g fill="#5a9e44">
      <circle cx="560" cy="326" r="18"/><circle cx="584" cy="320" r="22"/><circle cx="606" cy="328" r="14"/>
      <circle cx="1112" cy="324" r="20"/><circle cx="1134" cy="328" r="15"/>
    </g>

    <!-- the sign -->
    <rect x="142" y="84" width="12" height="270" fill="#8b5a2b" stroke="#6b421c" stroke-width="1.5"/>
    <rect x="142" y="92" width="330" height="10" fill="#8b5a2b" stroke="#6b421c" stroke-width="1.5"/>
    <g stroke="#6b421c" stroke-width="2"><line x1="200" y1="102" x2="200" y2="122"/><line x1="440" y1="102" x2="440" y2="122"/></g>
    <rect x="178" y="122" width="284" height="150" rx="6" fill="#ffffff" stroke="#c9ccd1" stroke-width="2"/>
    <path d="M178 128 a6 6 0 0 1 6 -6 h272 a6 6 0 0 1 6 6 v44 h-284z" fill="#c8102e"/>
    <text x="320" y="160" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="32" letter-spacing="3" fill="#ffffff">FOR SALE</text>
    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="middle">
      <text x="320" y="200" font-weight="700">charming 1999-era fixer-upper</text>
      <text x="320" y="224">original features. no css.</text>
      <text x="320" y="248">no node_modules. tons of space.</text>
    </g>
    <g transform="rotate(14 450 130)">
      <rect x="408" y="112" width="78" height="30" rx="3" fill="#ffd84d"/>
      <text x="447" y="133" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" fill="#1f2328">AS IS</text>
    </g>
    <g stroke="#6b421c" stroke-width="2"><line x1="214" y1="272" x2="214" y2="282"/><line x1="426" y1="272" x2="426" y2="282"/></g>
    <rect x="190" y="282" width="260" height="34" rx="4" fill="#c8102e"/>
    <text x="320" y="305" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#ffffff"><tspan font-weight="800">OPEN HOUSE:</tspan> open index.html</text>
  </g>
</svg>
